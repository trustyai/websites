<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V槽 CMS — 后台管理</title>
<link rel="icon" href="/assets/logo.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1e222a;--panel:#272c36;--panel-2:#313742;--border:#3d4552;--text:#e8ebf0;--muted:#9aa4b2;--brand:#23AC38;--brand-dark:#1a8c2d;--danger:#e5484d;--radius:10px}
body{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
button{cursor:pointer;border:none;font-family:inherit}
input,textarea,select{font-family:inherit}
a{color:var(--brand);text-decoration:none}
.hidden{display:none!important}
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 60% 50% at 50% 30%,rgba(35,172,56,0.18),transparent 70%),var(--bg)}
.login-card{width:360px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:2.2rem}
.login-card .logo{display:flex;align-items:center;gap:0.6rem;margin-bottom:1.6rem}
.login-card .logo img{height:38px}
.login-card .logo b{font-size:1.15rem}
.login-card h1{font-size:1.05rem;margin-bottom:0.3rem}
.login-card p{color:var(--muted);font-size:0.85rem;margin-bottom:1.4rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:0.82rem;color:var(--muted);margin-bottom:0.4rem}
.field input{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:0.7rem 0.9rem;border-radius:var(--radius);font-size:0.92rem}
.field input:focus{outline:none;border-color:var(--brand)}
.btn{background:var(--brand);color:#fff;padding:0.7rem 1.2rem;border-radius:var(--radius);font-size:0.92rem;font-weight:600;transition:all .2s}
.btn:hover{background:var(--brand-dark)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover{border-color:var(--brand)}
.err{color:var(--danger);font-size:0.82rem;margin-top:0.6rem;min-height:1rem}
#appView{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0}
.sidebar .brand{display:flex;align-items:center;gap:0.6rem;padding:1.1rem 1.1rem;border-bottom:1px solid var(--border)}
.sidebar .brand img{height:30px}
.sidebar .brand b{font-size:0.98rem}
.menu{flex:1;padding:0.55rem 0.5rem;overflow-y:auto}
.menu-item{display:flex;align-items:center;gap:0.65rem;padding:0.55rem 0.75rem;border-radius:var(--radius);color:var(--muted);font-size:0.88rem;cursor:pointer;transition:all .15s;margin-bottom:0.12rem}
.menu-item:hover{background:var(--panel-2);color:var(--text)}
.menu-item.active{background:rgba(35,172,56,0.14);color:var(--brand);font-weight:600}
.menu-item .ico{font-size:1.02rem;width:20px;text-align:center;flex-shrink:0}
.menu-group{margin-bottom:0.2rem}
.menu-group-title{display:flex;align-items:center;gap:0.65rem;padding:0.55rem 0.75rem;border-radius:var(--radius);color:var(--text);font-size:0.88rem;cursor:pointer;user-select:none}
.menu-group-title:hover{background:var(--panel-2)}
.menu-group-title .ico{width:20px;text-align:center}
.menu-group-title .chev{margin-left:auto;font-size:0.7rem;color:var(--muted);transition:transform .15s}
.menu-group.open .menu-group-title .chev{transform:rotate(180deg)}
.menu-sub{display:none;padding:0.1rem 0 0.35rem 0.35rem}
.menu-group.open .menu-sub{display:block}
.menu-sub .menu-item{padding-left:2.1rem;font-size:0.84rem;position:relative}
.menu-sub .menu-item::before{content:'';position:absolute;left:1.15rem;top:50%;width:5px;height:5px;border-radius:50%;background:var(--muted);transform:translateY(-50%);opacity:.55}
.menu-group.hidden-by-role{display:none!important}
.rte-up{display:inline-flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--border);color:var(--text);width:30px;height:28px;border-radius:5px;font-size:0.72rem;cursor:pointer;margin:0}
.rte-up:hover{border-color:var(--brand)}
.match-box{border:1px solid var(--border);border-radius:8px;padding:0.65rem 0.75rem;background:var(--panel-2)}
.match-group{margin-bottom:0.55rem}
.match-group:last-child{margin-bottom:0}
.match-group-title{font-size:0.75rem;color:var(--muted);margin-bottom:0.3rem;font-weight:600}
.match-checks{display:flex;flex-wrap:wrap;gap:0.35rem 0.7rem}
.match-check{font-size:0.82rem;display:inline-flex;align-items:center;gap:0.25rem;cursor:pointer;color:var(--text)}
.video-thumb{width:96px;height:54px;border-radius:6px;object-fit:cover;background:var(--panel-2);border:1px solid var(--border)}
.sidebar .foot{padding:0.8rem;border-top:1px solid var(--border)}
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:1rem;padding:0.9rem 1.4rem;background:var(--panel);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);flex-wrap:wrap}
.theme-sel{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:0.4rem 0.6rem;font-size:0.82rem;cursor:pointer}
.theme-sel:focus{outline:none;border-color:var(--brand)}
.topbar h2{font-size:1rem;margin-right:auto}
.lang-tabs{display:flex;gap:0.3rem;flex-wrap:wrap}
.lang-tab{padding:0.35rem 0.7rem;border-radius:50px;border:1px solid var(--border);background:var(--panel-2);color:var(--muted);font-size:0.8rem;cursor:pointer}
.lang-tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.save-hint{font-size:0.8rem;color:var(--muted)}
.save-hint.dirty{color:#f5a623}
.content{padding:1.4rem;max-width:960px;width:100%}
.content.wide{max-width:1280px}
.section{display:none}
.section.active{display:block;animation:fade .25s ease}
.table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:var(--radius)}
.table-scroll .ptable{margin:0}
.table-scroll .ptable th,.table-scroll .ptable td{vertical-align:top}
.opp-tabs{display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.75rem}
.opp-tabs .btn{padding:0.45rem 0.85rem;font-size:0.84rem}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-mask.hidden{display:none!important}
.modal-box{background:var(--panel);color:var(--text);width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:12px;padding:1.15rem 1.25rem;border:1px solid var(--border);box-shadow:0 16px 48px rgba(0,0,0,.28)}
.modal-box.chat-box{padding:0;display:flex;flex-direction:column;overflow:hidden;max-height:90vh;height:min(720px,90vh)}
.modal-head{display:flex;justify-content:space-between;gap:0.75rem;align-items:flex-start;margin-bottom:0.9rem}
.modal-head h3{margin:0 0 0.35rem;font-size:1.05rem;line-height:1.35}
.badge-row{display:flex;flex-wrap:wrap;gap:0.35rem;align-items:center;margin:0.25rem 0 0.45rem}
.buyer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.45rem 0.8rem;padding:0.7rem 0.8rem;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);margin-bottom:0.8rem;font-size:0.85rem}
.buyer-grid .bk{color:var(--muted);font-size:0.72rem}
.buyer-grid .bv{word-break:break-all}
.prod-mini{display:flex;gap:0.65rem;align-items:center;margin-bottom:0.8rem;padding:0.6rem 0.75rem;border:1px solid var(--border);border-radius:8px;background:var(--panel-2)}
.prod-mini img{width:52px;height:52px;object-fit:cover;border-radius:6px;flex-shrink:0;background:var(--panel)}
.msg-box{white-space:pre-wrap;padding:0.75rem;border:1px solid var(--border);border-radius:8px;margin-bottom:0.8rem;background:var(--panel-2);font-size:0.9rem;line-height:1.5}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem;margin-bottom:1.1rem}
.card>h3{font-size:0.95rem;margin-bottom:0.9rem;display:flex;align-items:center;gap:0.5rem}
.card .hint{color:var(--muted);font-size:0.8rem;margin:-0.4rem 0 0.8rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0.9rem}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.9rem}
label.lbl{display:block;font-size:0.8rem;color:var(--muted);margin-bottom:0.3rem}
.inp{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:0.55rem 0.75rem;border-radius:var(--radius);font-size:0.9rem}
.inp:focus{outline:none;border-color:var(--brand)}
textarea.inp{resize:vertical;min-height:60px;line-height:1.5}
.row{margin-bottom:0.8rem}
.list-item{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);padding:0.9rem;margin-bottom:0.7rem}
.li-head{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.6rem}
.li-title{font-size:0.85rem;font-weight:600;color:var(--muted)}
.li-actions{margin-left:auto;display:flex;gap:0.35rem}
.icon-btn{background:var(--panel);border:1px solid var(--border);color:var(--muted);width:26px;height:26px;border-radius:6px;font-size:0.8rem;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{color:var(--text);border-color:var(--brand)}
.icon-btn.del:hover{color:var(--danger);border-color:var(--danger)}
.add-btn{background:transparent;border:1px dashed var(--border);color:var(--muted);padding:0.55rem;border-radius:var(--radius);width:100%;font-size:0.86rem}
.add-btn:hover{border-color:var(--brand);color:var(--brand)}
.media-list{display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.5rem}
.media-thumb{position:relative;width:88px;height:58px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--panel)}
.media-thumb img,.media-thumb video{width:100%;height:100%;object-fit:cover}
.media-thumb .mt-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.6);color:#fff;width:18px;height:18px;border-radius:50%;font-size:0.65rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
.media-thumb .mt-type{position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,0.6);color:#fff;font-size:0.5rem;padding:1px 3px;border-radius:3px}
.logo-preview{height:40px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:0.3rem 0.6rem;display:inline-flex;align-items:center}
.logo-preview img{height:100%}
.prod-collapse{cursor:pointer}
.prod-body{margin-top:0.8rem}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:0.7rem 1.3rem;border-radius:50px;font-size:0.88rem;opacity:0;transition:all .3s;z-index:999;box-shadow:0 8px 30px rgba(0,0,0,0.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--brand)}
#toast.bad{border-color:var(--danger)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0.9rem;margin-bottom:1.1rem}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem}
.stat .n{font-size:1.7rem;font-weight:800;color:var(--brand)}
.stat .l{font-size:0.8rem;color:var(--muted);margin-top:0.2rem}
.quick a,.quick button{display:inline-block;margin:0 0.4rem 0.4rem 0}
.prog-row{display:flex;align-items:center;gap:0.6rem;margin-bottom:0.5rem;font-size:0.85rem}
.prog-row .name{width:90px;color:var(--muted)}
.prog-bar{flex:1;height:8px;background:var(--panel-2);border-radius:5px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--brand)}
#inboxBadge{background:var(--danger);color:#fff;border-radius:50px;font-size:0.62rem;padding:0 0.35rem;display:none}
.lead{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);padding:0.9rem;margin-bottom:0.7rem}
.lead.unread{border-left:3px solid var(--brand)}
.lead .lh{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;margin-bottom:0.4rem}
.lead .lh b{font-size:0.95rem}
.lead .lh .meta{font-size:0.75rem;color:var(--muted)}
.lead .lh .acts{margin-left:auto;display:flex;gap:0.35rem}
.lead .msg{font-size:0.88rem;color:var(--text);white-space:pre-wrap;line-height:1.5}
/* 产品/账号表格 */
.ptabs{display:flex;gap:0.3rem;border-bottom:1px solid var(--border);margin-bottom:0.9rem}
.ptab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:0.5rem 0.9rem;font-size:0.88rem;cursor:pointer;margin-bottom:-1px}
.ptab:hover{color:var(--text)}
.ptab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.ptoolbar{display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.9rem}
.ptoolbar .inp{width:auto;min-width:150px}
.ptoolbar .grow{flex:1}
.ptoolbar .count{font-size:0.82rem;color:var(--muted)}
.ptable{width:100%;border-collapse:collapse;font-size:0.88rem}
.ptable th,.ptable td{text-align:left;padding:0.6rem 0.6rem;border-bottom:1px solid var(--border);vertical-align:middle}
.ptable th{color:var(--muted);font-weight:600;font-size:0.78rem;white-space:nowrap}
.ptable tr:hover td{background:var(--panel-2)}
.ptable .pt-prod{display:flex;align-items:center;gap:0.7rem;min-width:220px}
.ptable .pt-thumb{width:52px;height:38px;border-radius:6px;overflow:hidden;background:var(--panel-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ptable .pt-thumb img{width:100%;height:100%;object-fit:cover}
.ptable .pt-name{font-weight:600;cursor:pointer}
.ptable .pt-sub{font-size:0.74rem;color:var(--muted)}
.ptable .pt-ops{white-space:normal;min-width:110px}
.ptable .pt-ops button{background:none;border:none;color:var(--brand);font-size:0.82rem;cursor:pointer;padding:0 0.35rem;display:inline-block;margin:0.1rem 0.15rem}
.ptable .pt-ops button.del{color:var(--danger)}
.ptable .pt-ops button:hover{text-decoration:underline}
.badge-role{font-size:0.68rem;padding:0.05rem 0.45rem;border-radius:50px;font-weight:600}
.badge-role.admin{background:rgba(229,72,77,0.16);color:#e5484d}
.badge-role.sales{background:rgba(35,172,56,0.16);color:var(--brand)}
.badge-role.editor{background:rgba(47,107,255,0.16);color:#5b8cff}
.badge-off{font-size:0.68rem;padding:0.05rem 0.45rem;border-radius:50px;background:var(--panel);color:var(--muted)}
/* 富文本编辑器 */
.rte-tb{display:flex;flex-wrap:wrap;gap:0.2rem;background:var(--panel-2);border:1px solid var(--border);border-bottom:none;border-radius:var(--radius) var(--radius) 0 0;padding:0.35rem}
.rte-tb button{background:var(--panel);border:1px solid var(--border);color:var(--text);width:30px;height:28px;border-radius:5px;font-size:0.82rem;cursor:pointer}
.rte-tb button:hover{border-color:var(--brand)}
.rte-area{min-height:160px;max-height:420px;overflow-y:auto;background:var(--panel-2);border:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius);padding:0.7rem 0.9rem;font-size:0.9rem;line-height:1.6;color:var(--text)}
.rte-area:focus{outline:none;border-color:var(--brand)}
.plist-row{display:flex;align-items:center;gap:0.9rem;padding:0.7rem;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:0.6rem;background:var(--panel-2)}
.plist-row .pl-thumb{width:64px;height:44px;border-radius:6px;overflow:hidden;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.plist-row .pl-thumb img{width:100%;height:100%;object-fit:cover}
.plist-row .pl-main{flex:1;min-width:0;cursor:pointer}
.plist-row .pl-name{font-weight:600;font-size:0.92rem}
.plist-row .pl-badge{font-size:0.68rem;background:rgba(35,172,56,0.16);color:var(--brand);padding:0.05rem 0.4rem;border-radius:50px;font-weight:600;margin-left:0.3rem}
.plist-row .pl-meta{font-size:0.75rem;color:var(--muted);margin-top:0.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist-row .pl-acts{display:flex;align-items:center;gap:0.35rem;flex-shrink:0}
.plist-row .pl-acts .btn{padding:0.4rem 0.8rem;font-size:0.82rem}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0.8rem}
.media-cell{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.media-cell .mc-thumb{height:100px;background:var(--panel-2);display:flex;align-items:center;justify-content:center}
.media-cell .mc-thumb img,.media-cell .mc-thumb video{width:100%;height:100%;object-fit:cover}
.media-cell .mc-info{padding:0.5rem}
.media-cell .mc-name{font-size:0.72rem;color:var(--muted);word-break:break-all;line-height:1.3;margin-bottom:0.4rem}
.media-cell .mc-acts{display:flex;gap:0.35rem}
.media-cell .mc-acts button{flex:1;font-size:0.72rem;padding:0.3rem;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--muted)}
.media-cell .mc-acts button:hover{color:var(--text);border-color:var(--brand)}
.media-cell .mc-acts button.del:hover{color:var(--danger);border-color:var(--danger)}
.picker-mask{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center}
.picker-box{width:min(760px,92vw);max-height:82vh;background:var(--panel);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.picker-head{display:flex;align-items:center;justify-content:space-between;padding:0.9rem 1.1rem;border-bottom:1px solid var(--border);font-size:0.95rem}
.picker-grid{padding:1rem;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:0.6rem}
.picker-grid .pk{cursor:pointer;border:2px solid transparent;border-radius:8px;overflow:hidden;height:80px;background:var(--panel-2)}
.picker-grid .pk:hover{border-color:var(--brand)}
.picker-grid .pk img,.picker-grid .pk video{width:100%;height:100%;object-fit:cover}
@media(max-width:820px){.sidebar{width:60px}.sidebar .brand b,.menu-item span:not(.ico),.sidebar .foot .btn span{display:none}.main{margin-left:60px}.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginView">
  <form class="login-card" id="loginForm">
    <div class="logo"><img src="/assets/logo.png" alt=""><b>V槽 CMS</b></div>
    <h1>后台登录</h1>
    <p>请输入管理员账号密码</p>
    <div class="field"><label>账号</label><input id="loginUser" autocomplete="username" value="admin"></div>
    <div class="field"><label>密码</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="默认 admin123"></div>
    <button type="submit" class="btn block">登录</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="appView" class="hidden">
  <aside class="sidebar">
    <div class="brand"><img src="/assets/logo.png" alt=""><b>V槽 CMS</b></div>
    <nav class="menu" id="menu">
      <div class="menu-item active" data-sec="dashboard"><span class="ico">🏠</span><span>概况</span></div>

      <div class="menu-group open" data-group="leads">
        <div class="menu-group-title"><span class="ico">✉️</span><span>商机中心</span><span class="chev">▾</span></div>
        <div class="menu-sub">
          <div class="menu-item" data-sec="inbox"><span>全部商机 <span id="inboxBadge"></span></span></div>
          <div class="menu-item" data-sec="chats"><span>聊天记录</span></div>
          <div class="menu-item" data-sec="chat"><span>在线客服话术</span></div>
        </div>
      </div>

      <div class="menu-group open" data-group="site">
        <div class="menu-group-title"><span class="ico">📄</span><span>建站与维护</span><span class="chev">▾</span></div>
        <div class="menu-sub">
          <div class="menu-item" data-sec="products"><span>产品管理</span></div>
          <div class="menu-item" data-sec="company"><span>公司信息</span></div>
