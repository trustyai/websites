<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V槽 CMS — 后台管理</title>
<link rel="icon" href="/assets/logo.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0f1720;--panel:#161f2b;--panel-2:#1d2836;--border:#2a3646;
--text:#e6edf3;--muted:#8b9bb0;--brand:#23AC38;--brand-dark:#1a8c2d;
--danger:#e5484d;--radius:10px;
}
body{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
button{cursor:pointer;border:none;font-family:inherit}
input,textarea,select{font-family:inherit}
a{color:var(--brand);text-decoration:none}
.hidden{display:none!important}

/* ---------- 登录 ---------- */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 60% 50% at 50% 30%,rgba(35,172,56,0.18),transparent 70%),var(--bg)}
.login-card{width:360px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:2.2rem}
.login-card .logo{display:flex;align-items:center;gap:0.6rem;margin-bottom:1.6rem}
.login-card .logo img{height:38px}
.login-card .logo b{font-size:1.15rem}
.login-card h1{font-size:1.05rem;margin-bottom:0.3rem}
.login-card p{color:var(--muted);font-size:0.85rem;margin-bottom:1.4rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:0.82rem;color:var(--muted);margin-bottom:0.4rem}
.field input{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:0.7rem 0.9rem;border-radius:var(--radius);font-size:0.92rem}
.field input:focus{outline:none;border-color:var(--brand)}
.btn{background:var(--brand);color:#fff;padding:0.7rem 1.2rem;border-radius:var(--radius);font-size:0.92rem;font-weight:600;transition:all .2s}
.btn:hover{background:var(--brand-dark)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover{border-color:var(--brand)}
.btn.danger{background:var(--danger)}
.err{color:var(--danger);font-size:0.82rem;margin-top:0.6rem;min-height:1rem}

/* ---------- 布局 ---------- */
#appView{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0}
.sidebar .brand{display:flex;align-items:center;gap:0.6rem;padding:1.2rem 1.2rem;border-bottom:1px solid var(--border)}
.sidebar .brand img{height:32px}
.sidebar .brand b{font-size:1rem}
.menu{flex:1;padding:0.8rem 0.6rem;overflow-y:auto}
.menu-item{display:flex;align-items:center;gap:0.7rem;padding:0.7rem 0.9rem;border-radius:var(--radius);color:var(--muted);font-size:0.9rem;cursor:pointer;transition:all .15s;margin-bottom:0.2rem}
.menu-item:hover{background:var(--panel-2);color:var(--text)}
.menu-item.active{background:rgba(35,172,56,0.14);color:var(--brand);font-weight:600}
.menu-item .ico{font-size:1.05rem;width:20px;text-align:center}
.sidebar .foot{padding:0.8rem;border-top:1px solid var(--border)}
.main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:1rem;padding:1rem 1.6rem;background:rgba(15,23,32,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.topbar h2{font-size:1.05rem;margin-right:auto}
.save-hint{font-size:0.8rem;color:var(--muted)}
.save-hint.dirty{color:#f5a623}
.content{padding:1.6rem;max-width:900px;width:100%}
.section{display:none}
.section.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ---------- 表单 ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:1.3rem;margin-bottom:1.2rem}
.card h3{font-size:0.95rem;margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem}
.card .hint{color:var(--muted);font-size:0.8rem;margin-bottom:1rem;margin-top:-0.6rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
label.lbl{display:block;font-size:0.8rem;color:var(--muted);margin-bottom:0.35rem}
.inp{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:0.6rem 0.8rem;border-radius:var(--radius);font-size:0.9rem}
.inp:focus{outline:none;border-color:var(--brand)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.5}
.row{margin-bottom:0.9rem}
.list-item{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:0.8rem;position:relative}
.list-item .li-head{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.7rem}
.li-head .li-title{font-size:0.85rem;font-weight:600;color:var(--muted)}
.li-actions{margin-left:auto;display:flex;gap:0.4rem}
.icon-btn{background:var(--panel);border:1px solid var(--border);color:var(--muted);width:28px;height:28px;border-radius:6px;font-size:0.85rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-btn:hover{color:var(--text);border-color:var(--brand)}
.icon-btn.del:hover{color:var(--danger);border-color:var(--danger)}
.add-btn{background:transparent;border:1px dashed var(--border);color:var(--muted);padding:0.6rem;border-radius:var(--radius);width:100%;font-size:0.88rem;transition:all .15s}
.add-btn:hover{border-color:var(--brand);color:var(--brand)}

/* 主题选择 */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0.8rem}
.theme-card{border:2px solid var(--border);border-radius:var(--radius);padding:0.9rem;cursor:pointer;transition:all .15s;position:relative}
.theme-card:hover{border-color:var(--muted)}
.theme-card.selected{border-color:var(--brand)}
.theme-swatch{display:flex;gap:4px;margin-bottom:0.6rem}
.theme-swatch span{width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,0.1)}
.theme-card .tc-name{font-size:0.88rem;font-weight:600}
.theme-card .tc-desc{font-size:0.72rem;color:var(--muted);margin-top:0.2rem;line-height:1.4}

/* 媒体上传 */
.media-list{display:flex;flex-wrap:wrap;gap:0.6rem;margin-bottom:0.6rem}
.media-thumb{position:relative;width:96px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--panel-2)}
.media-thumb img,.media-thumb video{width:100%;height:100%;object-fit:cover}
.media-thumb .mt-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.6);color:#fff;width:20px;height:20px;border-radius:50%;font-size:0.7rem;display:flex;align-items:center;justify-content:center}
.media-thumb .mt-type{position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,0.6);color:#fff;font-size:0.55rem;padding:1px 4px;border-radius:3px}
.logo-preview{height:44px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:0.3rem 0.6rem;display:inline-flex;align-items:center}
.logo-preview img{height:100%}
.uploading{font-size:0.78rem;color:#f5a623}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:0.7rem 1.3rem;border-radius:50px;font-size:0.88rem;opacity:0;transition:all .3s;z-index:999;box-shadow:0 8px 30px rgba(0,0,0,0.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--brand)}
#toast.bad{border-color:var(--danger)}

@media(max-width:760px){
.sidebar{width:64px}
.sidebar .brand b,.menu-item span:not(.ico),.sidebar .foot .btn span{display:none}
.main{margin-left:64px}
.grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- 登录 -->
<div id="loginView">
  <form class="login-card" id="loginForm">
    <div class="logo"><img src="/assets/logo.png" alt=""><b>V槽 CMS</b></div>
    <h1>后台登录</h1>
    <p>请输入管理员账号密码</p>
    <div class="field"><label>账号</label><input id="loginUser" autocomplete="username" value="admin"></div>
    <div class="field"><label>密码</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="默认 admin123"></div>
    <button type="submit" class="btn block">登录</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<!-- 后台主界面 -->
<div id="appView" class="hidden">
  <aside class="sidebar">
    <div class="brand"><img src="/assets/logo.png" alt=""><b>V槽 CMS</b></div>
    <nav class="menu" id="menu">
      <div class="menu-item active" data-sec="brand"><span class="ico">🎨</span><span>品牌与主题</span></div>
      <div class="menu-item" data-sec="hero"><span class="ico">🏠</span><span>首页文案</span></div>
      <div class="menu-item" data-sec="adv"><span class="ico">⭐</span><span>核心优势</span></div>
      <div class="menu-item" data-sec="products"><span class="ico">📦</span><span>产品管理</span></div>
      <div class="menu-item" data-sec="contact"><span class="ico">📞</span><span>联系与页脚</span></div>
      <div class="menu-item" data-sec="chat"><span class="ico">💬</span><span>在线客服</span></div>
      <div class="menu-item" data-sec="account"><span class="ico">🔒</span><span>账号安全</span></div>
    </nav>
    <div class="foot">
      <a href="/" target="_blank" class="btn ghost block" style="text-align:center;margin-bottom:0.5rem;display:block">🔗 <span>查看前台</span></a>
      <button class="btn ghost block" id="logoutBtn">🚪 <span>退出登录</span></button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="secTitle">品牌与主题</h2>
      <span class="save-hint" id="saveHint">已保存</span>
      <button class="btn" id="saveBtn">保存全部修改</button>
    </div>
    <div class="content">
      <div class="section active" data-sec="brand" id="secBrand"></div>
      <div class="section" data-sec="hero" id="secHero"></div>
      <div class="section" data-sec="adv" id="secAdv"></div>
      <div class="section" data-sec="products" id="secProducts"></div>
      <div class="section" data-sec="contact" id="secContact"></div>
      <div class="section" data-sec="chat" id="secChat"></div>
      <div class="section" data-sec="account" id="secAccount"></div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script src="/themes/themes.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
