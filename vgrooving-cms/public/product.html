<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品详情 | V槽PRO</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<nav id="siteNav"></nav>

<div class="product-page" id="productPage">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div class="product-main">
    <div class="gallery-section" id="productGallery">
      <div class="gallery-main" id="gMain"></div>
      <div class="gallery-thumbs" id="gThumbs"></div>
    </div>
    <div class="product-info" id="pInfo"></div>
  </div>
  <div class="spec-section" id="specSection"></div>
  <div class="related-section" id="relatedSection"></div>
</div>

<footer id="siteFooter"></footer>

<button class="chat-fab" id="chatFab" onclick="openChat()">💬</button>
<div class="chat-window" id="chatWindow">
  <div class="chat-win-header">
    <div class="cw-ava" id="cwAva"></div>
    <div class="cw-info"><strong id="cwName"></strong><span id="cwStatus"></span></div>
    <div class="cw-status"></div>
  </div>
  <div class="chat-msgs" id="chatMsgs"></div>
  <div class="chat-quick-chips" id="chatChips"></div>
  <div class="chat-input-row">
    <textarea class="c-inp" id="cInp" placeholder="..." rows="1" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
    <button class="c-send" onclick="cSend()">➤</button>
  </div>
</div>
<div class="lightbox" id="lightbox"></div>

<script src="/common.js"></script>
<script src="/product.js"></script>
</body>
</html>
